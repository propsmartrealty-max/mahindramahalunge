<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" fill="none" class="river-flowing-emblem">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9c846" />
      <stop offset="100%" stop-color="#e7971e" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a05740" />
      <stop offset="50%" stop-color="#c26f54" />
      <stop offset="100%" stop-color="#a05740" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a932" />
      <stop offset="50%" stop-color="#78cf4a" />
      <stop offset="100%" stop-color="#58a932" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a89c" />
      <stop offset="50%" stop-color="#28d7c7" />
      <stop offset="100%" stop-color="#16a89c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Golden Sun -->
  <circle cx="144" cy="18" r="10" fill="url(#sunGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="9.5;10.5;9.5" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Top Wave (Copper/Terracotta Earth Wave) -->
  <path d="M 30.0 36.0 C 40.2 28.0, 47.8 28.0, 58.0 36.0 C 68.2 44.0, 75.8 44.0, 86.0 36.0 C 96.2 28.0, 103.8 28.0, 114.0 36.0 C 124.2 44.0, 131.8 44.0, 142.0 36.0 C 152.2 28.0, 159.8 28.0, 170.0 36.0 C 180.2 44.0, 187.8 44.0, 198.0 36.0"
        stroke="url(#copperGrad)" stroke-width="8.5" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;56" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Mid Wave (Nature Foliage Green Wave) -->
  <path d="M 4.0 74.0 C 14.2 66.0, 21.8 66.0, 32.0 74.0 C 42.2 82.0, 49.8 82.0, 60.0 74.0 C 70.2 66.0, 77.8 66.0, 88.0 74.0 C 98.2 82.0, 105.8 82.0, 116.0 74.0 C 126.2 66.0, 133.8 66.0, 144.0 74.0 C 154.2 82.0, 161.8 82.0, 172.0 74.0"
        stroke="url(#greenGrad)" stroke-width="8.5" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;56" dur="3.5s" repeatCount="indefinite" />
  </path>

  <!-- Bottom Wave (Mula River Turquoise Flowing Wave) -->
  <path d="M 30.0 112.0 C 40.2 104.0, 47.8 104.0, 58.0 112.0 C 68.2 120.0, 75.8 120.0, 86.0 112.0 C 96.2 104.0, 103.8 104.0, 114.0 112.0 C 124.2 120.0, 131.8 120.0, 142.0 112.0 C 152.2 104.0, 159.8 104.0, 170.0 112.0 C 180.2 120.0, 187.8 120.0, 198.0 112.0"
        stroke="url(#tealGrad)" stroke-width="8.5" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;56" dur="3s" repeatCount="indefinite" />
  </path>
</svg>