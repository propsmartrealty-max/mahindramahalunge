<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#0c1017" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a9" />
      <stop offset="50%" stop-color="#d4af66" />
      <stop offset="100%" stop-color="#9a7b38" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
    <linearGradient id="copperWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8664e" />
      <stop offset="50%" stop-color="#d98268" />
      <stop offset="100%" stop-color="#b8664e" />
    </linearGradient>
    <linearGradient id="greenWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a932" />
      <stop offset="50%" stop-color="#7ad44c" />
      <stop offset="100%" stop-color="#58a932" />
    </linearGradient>
    <linearGradient id="tealWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a89c" />
      <stop offset="50%" stop-color="#2de3d3" />
      <stop offset="100%" stop-color="#16a89c" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Shield -->
  <rect x="4" y="4" width="184" height="184" rx="44" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4.5" />

  <!-- Centered River Waves & Sun Emblem (Scale ~0.72) -->
  <g transform="translate(17, 34) scale(0.72)" filter="url(#subtleGlow)">
    <!-- Golden Sun Circle -->
    <circle cx="144" cy="18" r="10" fill="url(#sunGrad)" />

    <!-- Top Copper Wave (Earth/Hill) -->
    <path d="M 30.0 36.0 C 40.2 28.0, 47.8 28.0, 58.0 36.0 C 68.2 44.0, 75.8 44.0, 86.0 36.0 C 96.2 28.0, 103.8 28.0, 114.0 36.0 C 124.2 44.0, 131.8 44.0, 142.0 36.0 C 152.2 28.0, 159.8 28.0, 170.0 36.0 C 180.2 44.0, 187.8 44.0, 198.0 36.0"
          stroke="url(#copperWave)" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Mid Leaf Green Wave (Bio-reserves) -->
    <path d="M 4.0 74.0 C 14.2 66.0, 21.8 66.0, 32.0 74.0 C 42.2 82.0, 49.8 82.0, 60.0 74.0 C 70.2 66.0, 77.8 66.0, 88.0 74.0 C 98.2 82.0, 105.8 82.0, 116.0 74.0 C 126.2 66.0, 133.8 66.0, 144.0 74.0 C 154.2 82.0, 161.8 82.0, 172.0 74.0"
          stroke="url(#greenWave)" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Bottom River Turquoise Wave (Mula River) -->
    <path d="M 30.0 112.0 C 40.2 104.0, 47.8 104.0, 58.0 112.0 C 68.2 120.0, 75.8 120.0, 86.0 112.0 C 96.2 104.0, 103.8 104.0, 114.0 112.0 C 124.2 120.0, 131.8 120.0, 142.0 112.0 C 152.2 104.0, 159.8 104.0, 170.0 112.0 C 180.2 120.0, 187.8 120.0, 198.0 112.0"
          stroke="url(#tealWave)" stroke-width="9" stroke-linecap="round" fill="none" />
  </g>
</svg>
